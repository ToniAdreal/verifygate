name: verify

# VerifyGate verifies itself in CI: the pytest suite, then the full
# clean-tree rehearsal (Judge Mode spine for both samples, the repair
# loops, the web view, dogfooding, and standalone record verification).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install test runner (VerifyGate itself is stdlib-only)
        run: python3 -m pip install pytest
      - name: Unit tests
        run: python3 -m pytest -q
      - name: Clean-tree rehearsal
        run: scripts/rehearse.sh
